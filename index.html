<!doctype html>
<html lang="zh-CN" data-theme="amber">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#191a17">
  <meta name="description" content="LizPink 的个人网站。学生 / Student，关注计算机图形学、计算机工程、游戏和人工智能。浏览经历与能力、研究与探索、生活与记录。">
  <title>LizPink · 个人终端</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="preload" href="./fonts/SourceSerif4Variable-Roman.ttf.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="./fonts/IBMPlexMono-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <script src="./theme.js"></script>
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./command-input.css">
  <script src="./content.js" defer></script>
  <script src="./commands.js" defer></script>
  <script src="./summaries.js" defer></script>
  <script src="./command-input.js" defer></script>
  <script src="./app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">跳到正文</a>
  <div class="site-shell">
    <div id="terminal-frame" class="terminal-frame" data-menu-open="false" data-menu-pinned="false">
      <header class="frame-toolbar">
      <a class="wordmark" href="#home" data-route="home" aria-label="LizPink 首页"><span class="logo-mark" aria-hidden="true">lp<span>_</span></span><span>LizPink<span aria-hidden="true">.</span></span></a>
        <span id="frame-location" class="frame-location" aria-hidden="true">~/home</span>
        <span class="terminal-status"><span class="status-light" aria-hidden="true"></span><span id="terminal-status">就绪</span></span>
      <div class="theme-control">
        <button id="theme-toggle" type="button" role="switch" aria-checked="false" aria-label="荧绿主题" title="切换为荧绿主题"><span class="theme-dot amber" aria-hidden="true"></span><span class="theme-dot green" aria-hidden="true"></span><span class="theme-thumb" aria-hidden="true"></span></button>
        <span id="theme-label" aria-hidden="true">琥珀</span>
      </div>
      </header>
      <div class="frame-layout">
        <button id="menu-reveal" type="button" aria-label="展开目录" aria-expanded="false" aria-controls="route-menu" title="展开目录"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></button>
        <nav id="route-menu" class="route-menu" aria-label="网站目录" hidden>
          <div class="sidebar-header"><p class="sidebar-label">目录</p><button id="menu-pin" type="button" aria-label="固定目录" aria-pressed="false" aria-controls="route-menu" title="固定目录"><svg class="pin-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 9V3H8v6l-3 3v2h14v-2l-3-3Z"/><path d="M12 14v7"/></svg></button><button id="menu-close" type="button" aria-label="关闭目录"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div>
          <button type="button" data-route="home">首页 <span>home</span></button>
          <button type="button" data-route="life">生活与记录 <span>01</span></button>
          <button type="button" data-route="resume">经历与能力 <span>02</span></button>
          <button type="button" data-route="research">研究与探索 <span>03</span></button>
        </nav>
        <button id="menu-backdrop" type="button" aria-label="关闭目录" hidden tabindex="-1"></button>
        <div class="frame-main">
    <main id="main" class="terminal-output" tabindex="-1" aria-label="终端输出">
      <section id="intro" class="intro" aria-labelledby="intro-title">
        <h1 id="intro-title">你好，我是 <span>LizPink.</span></h1>
      </section>
      <p id="terminal-hint" class="terminal-hint">选择<button id="menu-hint" class="hint-action" type="button" aria-expanded="false" aria-controls="route-menu">左侧目录</button>，或输入 <button class="hint-action" type="button" data-command="help" aria-label="查看命令帮助"><code>help</code></button> 查看命令。</p>
      <div id="terminal-records" class="terminal-records" aria-label="会话记录"></div>
    <section class="command-area" aria-label="命令行终端">
      <div class="command-row">
        <form id="command-form" autocomplete="off">
          <label for="command-input"><span aria-hidden="true">&gt;</span><span class="sr-only">输入命令</span></label>
          <div class="command-editor">
            <input id="command-input" name="command" type="text" role="combobox" placeholder="help 查看命令" enterkeyhint="send" spellcheck="false" autocapitalize="off" aria-describedby="command-feedback" aria-autocomplete="list" aria-controls="command-suggestions" aria-expanded="false" maxlength="160">
            <span id="cursor-layer" class="cursor-layer" aria-hidden="true"><span id="cursor-text"></span><span class="block-cursor"></span></span>
          </div>
        </form>
      </div>
      <div id="command-suggestions" class="command-suggestions" role="listbox" aria-label="可补全命令" hidden></div>
      <p id="command-feedback" class="command-feedback" role="status" aria-live="polite"></p>
    </section>
    </main>
        </div>
      </div>
    </div>
  </div>
  <div id="route-announcement" class="sr-only" role="status" aria-live="polite"></div>
  <noscript><p class="noscript">请启用 JavaScript 后浏览目录或使用命令。</p></noscript>
</body>
</html>
