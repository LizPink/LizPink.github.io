<!doctype html>
<html lang="zh-CN" data-theme="amber">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#191a17">
  <meta name="description" content="{{SITE_DESCRIPTION}}">
  <title>{{SITE_NAME}} · 个人终端</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="preload" href="./assets/fonts/SourceSerif4Variable-Roman.ttf.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="./assets/fonts/IBMPlexMono-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <script src="./assets/js/theme.js"></script>
  <link rel="stylesheet" href="./assets/css/styles.css">
  <link rel="stylesheet" href="./assets/css/command-input.css">
  <link rel="stylesheet" href="./assets/css/content-sidebar.css">
  <link rel="stylesheet" href="./assets/css/article-outline.css">
  <script src="./assets/js/content.js" defer></script>
  <script src="./assets/js/content-index.js" defer></script>
  <script src="./assets/js/commands.js" defer></script>
  <script src="./assets/js/summaries.js" defer></script>
  <script src="./assets/js/command-input.js" defer></script>
  <script src="./assets/js/output-motion.js" defer></script>
  <script src="./assets/js/content-sidebar.js" defer></script>
  <script src="./assets/js/article-outline.js" defer></script>
  <script src="./assets/js/app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">跳到正文</a>
  <div class="site-shell">
    <div id="terminal-frame" class="terminal-frame" data-menu-open="false" data-menu-pinned="false">
      <header class="frame-toolbar">
        <div class="toolbar-start">
          <button id="menu-reveal" type="button" aria-label="展开内容目录" aria-expanded="false" aria-controls="route-menu" title="展开内容目录"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="1"/><path d="M9 4v16"/></svg><span>目录</span></button>
          <a class="wordmark" href="#home" data-route="home" aria-label="{{SITE_NAME}} 首页"><span class="logo-mark" aria-hidden="true">lp<span>_</span></span><span>{{SITE_NAME}}<span aria-hidden="true">.</span></span></a>
        </div>
        <span id="frame-location" class="frame-location" aria-hidden="true">~/home</span>
        <span class="terminal-status"><span class="status-light" aria-hidden="true"></span><span id="terminal-status">就绪</span></span>
      <div class="theme-control">
        <button id="theme-toggle" type="button" role="switch" aria-checked="false" aria-label="荧绿主题" title="切换为荧绿主题"><span class="theme-dot amber" aria-hidden="true"></span><span class="theme-dot green" aria-hidden="true"></span><span class="theme-thumb" aria-hidden="true"></span></button>
        <span id="theme-label" aria-hidden="true">琥珀</span>
      </div>
      </header>
      <div class="frame-layout">
        <nav id="route-menu" class="route-menu" aria-label="内容目录" hidden>
          <div class="sidebar-header"><p class="sidebar-label">内容目录</p><button id="menu-close" type="button" aria-label="收起内容目录" aria-controls="route-menu" title="收起内容目录"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="1"/><path d="M9 4v16m7-11-3 3 3 3"/></svg></button></div>
          <div class="sidebar-routes" role="group" aria-label="栏目">
            <button type="button" data-route="home" aria-label="首页">首页 <span>home</span></button>
            <button type="button" data-route="life" aria-label="生活">生活 <span>01</span></button>
            <button type="button" data-route="resume" aria-label="经历">经历 <span>02</span></button>
            <button type="button" data-route="project" aria-label="项目">项目 <span>03</span></button>
          </div>
          <div class="content-index-heading"><h2 id="content-index-title">全部内容</h2><span id="content-index-count"></span></div>
          <ul id="content-list" class="content-list" aria-labelledby="content-index-title"></ul>
        </nav>
        <div id="sidebar-resizer" role="separator" tabindex="0" aria-label="调整内容目录宽度，左右方向键调节，Home 最窄，End 最宽" aria-orientation="vertical" aria-controls="route-menu" aria-valuemin="180" aria-valuemax="420" aria-valuenow="200" title="拖动调整目录宽度；双击恢复默认宽度" hidden></div>
        <button id="menu-backdrop" type="button" aria-label="关闭目录" hidden tabindex="-1"></button>
        <div class="frame-main">
    <main id="main" class="terminal-output" tabindex="-1" aria-label="终端输出">
      <section id="intro" class="intro" aria-labelledby="intro-title">
        <h1 id="intro-title">{{SITE_GREETING}}</h1>
      </section>
      <div id="terminal-records" class="terminal-records" aria-label="会话记录"></div>
    <section class="command-area" aria-label="命令行终端">
      <div class="command-row">
        <form id="command-form" autocomplete="off">
          <label for="command-input"><span aria-hidden="true">&gt;</span><span class="sr-only">输入命令</span></label>
          <div class="command-editor">
            <input id="command-input" name="command" type="text" role="combobox" placeholder=" " enterkeyhint="send" spellcheck="false" autocapitalize="off" aria-describedby="command-feedback" aria-autocomplete="list" aria-controls="command-suggestions" aria-expanded="false" maxlength="160">
            <span id="cursor-layer" class="cursor-layer" aria-hidden="true"><span id="cursor-text"></span><span class="block-cursor"></span></span>
          </div>
        </form>
      </div>
      <div id="command-suggestions" class="command-suggestions" role="listbox" aria-label="可补全命令" hidden></div>
      <p id="command-feedback" class="command-feedback" role="status" aria-live="polite"></p>
    </section>
    </main>
        </div>
      </div>
    </div>
  </div>
  <div id="route-announcement" class="sr-only" role="status" aria-live="polite"></div>
  <noscript><p class="noscript">请启用 JavaScript 后浏览目录或使用命令。</p></noscript>
</body>
</html>
